[pytest]
minversion = 7.4
asyncio_mode = auto
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Coverage settings
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=src/umes
    --cov-report=term-missing:skip-covered
    --cov-report=html:coverage_html
    --cov-report=xml
    --cov-fail-under=100
    -vv

# Test markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require containers)
    smoke: Smoke tests (basic functionality checks)
    contract: Contract/API tests (OpenAPI compliance)
    security: Security tests (penetration, fuzzing)
    performance: Performance/load tests (slow)
    slow: Slow running tests
    kms: Tests requiring KMS adapters
    idp: Tests requiring IdP adapters
    rls: Tests for Row-Level Security
    audit: Tests for audit logging

# Environment variables for tests
env =
    ENVIRONMENT=test
    LOG_LEVEL=DEBUG
    DATABASE_URL=postgresql+asyncpg://umes:umes@localhost:5432/umes_test
    REDIS_URL=redis://localhost:6379/0
    JWT_SECRET_KEY=test-secret-key-32-characters-min
    JWT_ALGORITHM=HS256
    JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
    JWT_REFRESH_TOKEN_EXPIRE_DAYS=7

# Output settings
console_output_style = progress
log_cli = false
log_cli_level = INFO
