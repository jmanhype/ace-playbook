# Pre-commit hooks for RCST v2
# Implements Constitution §VIII (Code Quality Standards)
#
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Backend Python hooks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.14
    hooks:
      - id: ruff
        name: Run Ruff (Python linter)
        args: [--fix]
        files: ^backend/

  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        name: Run Black (Python formatter)
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: Run MyPy (Python type checker)
        args: [--strict, --ignore-missing-imports]
        files: ^backend/src/
        additional_dependencies:
          - pydantic
          - sqlalchemy
          - types-redis

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        name: Run Bandit (Python security linter)
        args: [-r, backend/src, -x, backend/tests]
        files: ^backend/

  # Frontend TypeScript/React hooks
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        name: Run ESLint (TypeScript/React linter)
        files: ^frontend/.*\.[jt]sx?$
        types: [file]
        args: [--fix, --max-warnings=0]
        additional_dependencies:
          - eslint@8.56.0
          - "@typescript-eslint/eslint-plugin@6.19.0"
          - "@typescript-eslint/parser@6.19.0"
          - eslint-plugin-react@7.33.2
          - eslint-plugin-react-hooks@4.6.0
          - eslint-plugin-jsx-a11y@6.8.0
          - eslint-config-prettier@9.1.0

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.2.4
    hooks:
      - id: prettier
        name: Run Prettier (TypeScript/React formatter)
        files: ^frontend/.*\.(ts|tsx|json|css|md)$
        args: [--write]

  # General hooks (all languages)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
        args: [--safe]
      - id: check-json
        name: Check JSON syntax
      - id: check-added-large-files
        name: Check for large files
        args: [--maxkb=1000]
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: detect-private-key
        name: Detect private keys
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: [--fix=lf]

  # Security scanning for secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args: [--baseline, .secrets.baseline]
        exclude: package-lock.json

  # SQL formatting (for migration files)
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 2.3.5
    hooks:
      - id: sqlfluff-lint
        name: Lint SQL files
        files: ^backend/alembic/versions/.*\.py$
        args: [--dialect, postgres]

# Configuration for specific file types
exclude: |
  (?x)^(
      .*\.lock$ |
      .*\.min\.js$ |
      .*\.min\.css$ |
      node_modules/ |
      dist/ |
      build/ |
      coverage/ |
      __pycache__/ |
      \.venv/ |
      \.mypy_cache/ |
      \.pytest_cache/ |
      \.ruff_cache/
  )$
