[tool.poetry]
name = "rcst-v2-backend"
version = "0.1.0"
description = "RCST v2 - Enterprise Regulatory Compliance Platform Backend"
authors = ["RCST Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
# Web Framework
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = {extras = ["email"], version = "^2.5.0"}
pydantic-settings = "^2.1.0"

# Database
sqlalchemy = "^2.0.25"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.29.0"
pgvector = "^0.2.4"

# Redis & Caching
redis = "^5.0.1"
hiredis = "^2.3.2"

# Background Tasks
celery = {extras = ["redis"], version = "^5.3.4"}

# Authentication & Authorization
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
authlib = "^1.3.0"

# Document Processing
docling = "^1.2.0"
pypdf2 = "^3.0.1"
python-docx = "^1.1.0"
openpyxl = "^3.1.2"

# LLM & AI
dspy-ai = "^2.4.0"
openai = "^1.10.0"
anthropic = "^0.18.0"
sentence-transformers = "^2.3.1"

# Logic & Verification
pyreason = "^2.2.0"
z3-solver = "^4.12.6"

# Report Generation
weasyprint = "^60.2"
reportlab = "^4.0.9"

# Observability
opentelemetry-api = "^1.22.0"
opentelemetry-sdk = "^1.22.0"
opentelemetry-instrumentation-fastapi = "^0.43b0"
opentelemetry-instrumentation-sqlalchemy = "^0.43b0"
opentelemetry-instrumentation-redis = "^0.43b0"
prometheus-client = "^0.19.0"
structlog = "^24.1.0"

# Circuit Breakers & Resilience
circuitbreaker = "^2.0.0"
tenacity = "^8.2.3"

# Security
cryptography = "^42.0.0"

# Utilities
python-dateutil = "^2.8.2"
pytz = "^2024.1"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.0.0"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
hypothesis = "^6.98.2"
httpx = "^0.26.0"
locust = "^2.20.0"

# Code Quality
mypy = "^1.8.0"
ruff = "^0.1.14"
black = "^24.1.1"
bandit = "^1.7.6"
semgrep = "^1.55.2"
detect-secrets = "^1.4.0"
safety = "^3.0.1"
trivy = "^0.48.0"

# Type Stubs
types-redis = "^4.6.0"
types-pytz = "^2024.1.0"
types-python-dateutil = "^2.8.19"
sqlalchemy-stubs = "^0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = false
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
    "docling.*",
    "dspy.*",
    "pyreason.*",
    "z3.*",
    "circuitbreaker.*",
    "weasyprint.*",
    "reportlab.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit (security)
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
    "S101",  # use of assert (allowed in tests)
]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["S101", "T20"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101"]  # assert_used (allowed in tests)

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
