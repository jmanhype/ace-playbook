  appendage_lock: exactly two legs, two arms, one tail; preserve reptilian limb topology and claw count across every page; tail is thick at base, tapering gradually, never split; dorsal plates remain attached to spine, never separate weapons
  accessory_prop_lock: no worn props or accessories; only canonical ability effects allowed: blue-white atomic breath, dorsal plate glow, throat glow, radiation haze; miniature city silhouettes may be used only as scale references
  chromatic_lock: primary charcoal black/dark slate hide; secondary ash-gray and bone-gray dorsal plates; accent cyan-blue atomic glow; amber/yellow eyes; ivory teeth and claws; subtle wet specular highlights
  material_lock: matte-to-wet reptilian scales, hard chipped keratin dorsal plates, ivory claw/tooth enamel, emissive plasma-like atomic energy; surface must feel massive, scarred, and tactile
  style_lock: professional production kaiju character bible; cinematic Toho monster-film creature design reference; clean model-sheet clarity; detailed creature concept art; neutral studio background unless page-specific scale elements are required; preserve identity over painterly flourish
  signature_visual_hooks: colossal upright reptilian silhouette, jagged dorsal plate ridge, thick tail, tiny fierce eyes under heavy brow, charcoal radioactive hide, city-scale weight, cyan atomic breath charge
DO_NOT_CHANGE: Godzilla identity, colossal bipedal reptile morphology, cranial topology, dorsal plate spine, tail topology, clawed extremities, charcoal-and-cyan chromatic signature, rough radioactive hide, and signature visual hooks.
BOUNDED_VARIATION: pose, roar intensity, dorsal plate glow strength, city scale silhouettes, callout placement, controlled wetness/specular intensity, slight camera angle appropriate to page task.
PRESENTATION_CONSTRAINT: Keep the kaiju non-cute, non-comedic, non-humanoid beyond upright stance; no gore; no extra monsters; no logos; production reference clarity over action-poster chaos.
DEFAULTS_ANNOTATED: character_class supplied as colossal kaiju; unspecified construction defaults use creature model-sheet conventions; background defaults to neutral gray/off-white studio board unless scale or motion callouts require subtle city silhouettes.
