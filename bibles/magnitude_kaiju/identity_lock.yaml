  age_cohort: ancient irradiated apex creature
  species: prehistoric amphibious reptilian kaiju mutated by radiation
  role: iconic city-scale titan, unstoppable force of nature, nuclear-age monster god
  scale_lock: approximately 300 feet tall; twenty-plus-story mass; human-scale elements must read as tiny; silhouette must feel city-dominating and extremely heavy
  morphology_lock: massive upright reptilian body; barrel torso; thick armored neck; heavy hips; pillar-like muscular legs; broad clawed feet; short but powerful arms; four clawed fingers per hand; three dominant forward toe claws per foot plus rear dewclaw suggestion; long powerful counterbalance tail sweeping behind; entire spine lined with jagged irregular dorsal plates from skull/neck through back into tail; slow thunderous bipedal posture
  cranial_lock: unmistakable Godzilla head topology; broad blunt reptilian skull; squared crocodilian snout; heavy brow ridge; small fierce amber eyes; nostril slits; rows of uneven ivory teeth; wide roaring jaw; no mammalian ears, no horns, no hair, no wings; head fused into a thick muscular neck
